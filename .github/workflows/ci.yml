# CI for the FastAPI demo (learn-cicd/fastapi-demo).
# Monorepo pattern: this lives at the repo ROOT (so GitHub runs it) but is
# PATH-FILTERED to fastapi-demo/**, so it only runs when the demo changes -
# never on plain notes edits.
name: CI (fastapi-demo)

on:
  push:
    paths:
      - "fastapi-demo/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "fastapi-demo/**"

defaults:
  run:
    working-directory: fastapi-demo   # all `run:` steps execute inside the demo folder

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fastapi-demo/requirements.txt
      - run: pip install flake8
      - run: flake8 app tests

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false                # see failures on ALL versions, not just the first
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: fastapi-demo/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -v

  build:
    name: Build image (verify it containerises)
    runs-on: ubuntu-latest
    needs: [lint, test]               # gate: only build if lint AND tests passed
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fastapi-demo:${{ github.sha }} .
