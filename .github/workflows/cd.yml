# CD for the FastAPI demo. CI gates CD: this runs ONLY AFTER the CI workflow
# finishes successfully on main (workflow_run). It builds + pushes the image to
# GHCR (live), then deploys to Kubernetes IF a KUBECONFIG_DATA secret is set.
name: CD (fastapi-demo)

on:
  workflow_run:
    workflows: ["CI (fastapi-demo)"]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/fastapi-demo   # ghcr.io/<owner>/<repo>/fastapi-demo

jobs:
  build-push:
    name: Build and push image
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}   # only if CI passed
    permissions:
      contents: read
      packages: write                # needed to push to GHCR with GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}   # build the EXACT commit CI tested
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: fastapi-demo
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-push
    env:
      KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DATA }}
      IMAGE: ghcr.io/${{ github.repository }}/fastapi-demo:${{ github.event.workflow_run.head_sha }}
    steps:
      # If no kubeconfig secret exists, the image is still built+pushed - we just
      # skip the live rollout cleanly (green run, not a red failure).
      - name: No kubeconfig secret? Skip cleanly.
        if: env.KUBECONFIG_DATA == ''
        run: |
          echo "KUBECONFIG_DATA secret is not set, so the live deploy is skipped."
          echo "The image was built and pushed to GHCR. To enable CD to k8s, add a"
          echo "base64 kubeconfig as the KUBECONFIG_DATA repo secret (see cd/README.md)."

      - name: Configure kubectl
        if: env.KUBECONFIG_DATA != ''
        run: |
          echo "$KUBECONFIG_DATA" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Deploy (rolling update)
        if: env.KUBECONFIG_DATA != ''
        run: |
          NS="${{ vars.K8S_NAMESPACE || 'default' }}"
          kubectl set image deployment/fastapi-demo fastapi-demo="$IMAGE" -n "$NS"
          kubectl rollout status deployment/fastapi-demo -n "$NS"

      - name: Smoke test
        if: env.KUBECONFIG_DATA != ''
        run: echo "Add your app URL here, e.g. curl -f https://<host>/health"
