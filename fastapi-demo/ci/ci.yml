# =============================================================================
# TEACHING COPY of the CI workflow (read this in class).
# The LIVE copy that GitHub actually runs is at the repo root:
#     .github/workflows/ci.yml   (identical to this file)
# GitHub only runs workflows from <repo-root>/.github/workflows/, which is why
# the running copy lives there and this annotated copy lives with the lesson.
# =============================================================================
name: CI (fastapi-demo)

# Runs on every push and PR that touches the demo folder (monorepo path filter).
on:
  push:
    paths:
      - "fastapi-demo/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "fastapi-demo/**"

defaults:
  run:
    working-directory: fastapi-demo   # `run:` steps execute inside the demo folder

jobs:
  # --- Job 1: Lint (static checks) ---
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fastapi-demo/requirements.txt
      - run: pip install flake8
      - run: flake8 app tests

  # --- Job 2: Test across Python versions, in parallel (matrix) ---
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false                # see all version failures, not just the first
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: fastapi-demo/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -v

  # --- Job 3: Build the image (proves it containerises); only if lint + test pass ---
  build:
    name: Build image (verify it containerises)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fastapi-demo:${{ github.sha }} .
      # Note: this only BUILDS. Pushing + deploying is CD (see ../cd/).
