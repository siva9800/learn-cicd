# ClusterIP Service (no cloud LoadBalancer, so no ELB cost). Reach it with
# `kubectl port-forward svc/fastapi-demo 8080:80` and open http://localhost:8080.
apiVersion: v1
kind: Service
metadata:
  name: fastapi-demo
  labels:
    app: fastapi-demo
spec:
  type: ClusterIP
  selector:
    app: fastapi-demo
  ports:
    - port: 80
      targetPort: 8000
