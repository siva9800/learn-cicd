# ---------------------------------------------------------------------------
# Full CI/CD pipeline - the complete demo (Days 2, 3, 4, 5).
# On a push to main it: tests -> builds and pushes a Docker image -> deploys to
# Kubernetes. Each job only runs if the previous one succeeded.
#
# To actually run this, copy it to the REPOSITORY ROOT at .github/workflows/cicd.yml
#
# Required setup (see demo/README.md):
#   - A Kubernetes cluster reachable from the runner.
#   - A repository secret named KUBE_CONFIG holding a base64-encoded kubeconfig.
#   - The k8s/ manifests applied once so the Deployment exists.
# ---------------------------------------------------------------------------
name: CI/CD

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # e.g. ghcr.io/owner/repo

jobs:
  # ---------- Stage 1: test (the gate) ----------
  test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: pytest -v

  # ---------- Stage 2: build and push the image ----------
  build:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: test                 # only build if tests passed
    permissions:
      contents: read
      packages: write           # least privilege - just enough to push (Day 3)
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # built in, no setup needed

      - name: Build and push image tagged with the commit SHA
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Immutable SHA tag + a moving latest tag (Day 4).
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  # ---------- Stage 3: deploy to Kubernetes (gated) ----------
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build
    environment: production     # add required reviewers here for an approval gate (Day 3)
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure cluster access
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Deploy the new image
        run: |
          # Point the Deployment at the image we just built and pushed.
          kubectl set image deployment/cicd-demo \
            cicd-demo=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          # Wait for the rolling update to finish; if it fails, the job fails.
          kubectl rollout status deployment/cicd-demo --timeout=120s

      - name: Smoke test
        run: |
          # Confirm the service answers on /health after the deploy (Day 4).
          # ClusterIP service is reached here via kubectl port-forward in the runner.
          kubectl port-forward service/cicd-demo 8080:80 &
          sleep 5
          curl -f http://localhost:8080/health
