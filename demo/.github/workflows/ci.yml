# ---------------------------------------------------------------------------
# CI workflow - runs on every push and pull request.
# This is the "quality gate" from Day 2: if tests or lint fail, the run is red
# and (with branch protection on) the change cannot be merged.
#
# To actually run this, copy it to the REPOSITORY ROOT at .github/workflows/ci.yml
# (GitHub only runs workflows that live at the root, not in a subfolder).
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (syntax check)
        run: |
          pip install flake8
          # Stop the build on real errors; treat style issues as warnings only.
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run tests
        run: pytest -v
