# Kubernetes Deployment for the demo app (ties back to the Kubernetes module).
# The pipeline updates the image of this Deployment on every release.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-demo
  labels:
    app: cicd-demo
spec:
  replicas: 2                      # two pods, so updates are zero-downtime
  selector:
    matchLabels:
      app: cicd-demo
  template:
    metadata:
      labels:
        app: cicd-demo
    spec:
      containers:
        - name: cicd-demo
          # PLACEHOLDER is replaced by the pipeline with the real image:sha.
          # For a manual test, set this to your pushed image.
          image: ghcr.io/OWNER/REPO:latest
          ports:
            - containerPort: 5000
          # Probes call /health (Day 21 - Monitoring & Logging).
          readinessProbe:           # gates traffic until the app is ready
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:            # restarts the container if it gets stuck
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:                # requests/limits (Day 16)
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
